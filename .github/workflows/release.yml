name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGATEDADDY_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release -j4

      - name: Test
        run: ./build/GateDaddyTest_artefacts/Release/GateDaddyTest

      - name: Package
        run: ./scripts/package-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DGATEDADDY_BUILD_TESTS=OFF -DGATEDADDY_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(GateDaddy VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          $art = "build/GateDaddy_artefacts/Release"
          Compress-Archive -Path "$art/VST3/Gate Daddy.vst3", "$art/Standalone/Gate Daddy.exe" -DestinationPath "dist/GateDaddy-$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gate Daddy $GITHUB_REF_NAME" \
            --generate-notes
